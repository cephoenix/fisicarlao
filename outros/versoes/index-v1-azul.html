<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd8">
<title>FisiCarlão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="katex.min.js"></script>
<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}

/* Layout: coluna de app de celular sobre papel quadriculado de caderno; navegação fixa embaixo */
:root{
  --paper:#f6f8fb; --grid:#dfe6f0; --ink:#14213a; --muted:#5b6782;
  --card:#ffffff; --line:#d5dceb; --accent:#1f4fd8; --accent-ink:#ffffff;
  --marker:#ffe066; --marker-ink:#3a2f00; --soft:#e9effd;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1524; --grid:#1a2338; --ink:#e7ecf7; --muted:#9aa6c2;
  --card:#161f33; --line:#27324c; --accent:#7ea2ff; --accent-ink:#0b1430;
  --marker:#e8c94a; --marker-ink:#2a2200; --soft:#1d2945; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1524; --grid:#1a2338; --ink:#e7ecf7; --muted:#9aa6c2;
  --card:#161f33; --line:#27324c; --accent:#7ea2ff; --accent-ink:#0b1430;
  --marker:#e8c94a; --marker-ink:#2a2200; --soft:#1d2945; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.app{max-width:460px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;line-height:1}
.logo b{color:var(--accent)}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0;margin-top:4px}
.badge-prof{font-size:.75rem;background:var(--marker);color:var(--marker-ink);padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.topic{margin-top:18px}
.topic-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.topic-head h2{font-size:1.25rem}
.topic-head span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .name{font-weight:700}
.row .eq{color:var(--muted);font-size:1.05rem;overflow-x:auto;min-width:0}
.row .go{color:var(--accent);font-weight:700;font-size:1.3rem}
.row > div{min-width:0}

.area-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.area-head h2{font-size:1.5rem;letter-spacing:-.01em}
.area-head span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.area-head:first-of-type{margin-top:8px}
.chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap}
.count{font-size:.85rem;color:var(--muted);margin:0 0 4px}

/* detalhe */
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.detail h2{font-size:1.7rem;margin:4px 0 14px}
.board{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:22px 12px;text-align:center;font-size:1.7rem;overflow-x:auto}
.actions{display:flex;gap:8px;margin:10px 0 0}
.fav{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.fav[aria-pressed="true"]{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
section.block{margin-top:22px}
section.block h3{font-size:1.1rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.tag{font-family:var(--body);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--accent)}
.tag.free{background:var(--marker);color:var(--marker-ink)}
.vars{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.vars td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.vars tr:first-child td{border-top:0}
.vars td:first-child{width:3.5rem;text-align:center;font-size:1.1rem}
.vars td:last-child{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap;text-align:right}
.example{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.example p{margin:0 0 8px}
.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.answer{margin-top:10px;padding:8px 12px;background:var(--soft);border-radius:10px;font-weight:700}
.tip{border-left:4px solid var(--marker);padding:8px 14px;background:var(--card);border-radius:0 12px 12px 0}
.video{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.thumb{flex:0 0 96px;aspect-ratio:16/9;max-width:100%;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font-size:1.3rem}
.video small{color:var(--muted);display:block}
.premium{background:var(--ink);color:var(--paper);border-radius:18px;padding:18px}
.premium h3{color:var(--paper);font-size:1.25rem;margin-bottom:6px}
.premium ul{margin:8px 0 14px;padding-left:1.1rem;opacity:.9}
.buy{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price{font-family:var(--display);font-size:1.6rem;font-weight:800}
.price small{font-family:var(--body);font-size:.75rem;font-weight:400;opacity:.75;display:block}
.btn{background:var(--marker);color:var(--marker-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
.note{font-size:.8rem;opacity:.8;margin-top:10px}

/* aulas */
.course{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.course .buy{margin-top:6px}
.course .price{color:var(--ink)}
.course .btn{background:var(--accent);color:var(--accent-ink)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.proto{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nav button{background:none;border:0;padding:8px 4px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:1.2rem;font-family:var(--display)}
.nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Fisi<b>Carlão</b><small>Fórmulas de física na palma da mão</small></div>
    <span class="badge-prof">Ensino médio</span>
  </header>
  <main id="view" class="view"></main>
  <p class="proto">Versão de teste · preços, vídeos e links são exemplos</p>
</div>

<nav class="nav" aria-label="Navegação principal">
  <div class="nav-in">
    <button id="nav-formulas" data-tab="formulas" aria-current="page"><span>ƒ</span>Fórmulas</button>
    <button id="nav-favs" data-tab="favs"><span>★</span>Favoritas</button>
    <button id="nav-aulas" data-tab="aulas"><span>▶</span>Aulas</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script>
const AREAS = window.AREAS, TOPICS = window.TOPICS, F = window.F;
const areaOf = {}; AREAS.forEach(a=>a.assuntos.forEach(t=>areaOf[t]=a));
const view = document.getElementById("view");
let state = {tab:"formulas", area:"mec", q:"", open:null};
let favs = [];
try{ favs = JSON.parse(localStorage.getItem("fisi-favs")||"[]") }catch(e){}
function saveFavs(){ try{ localStorage.setItem("fisi-favs", JSON.stringify(favs)) }catch(e){} }

function tex(s, display){
  try{ if(window.katex) return katex.renderToString(s,{output:"mathml",displayMode:!!display,throwOnError:false}) }catch(e){}
  return '<span style="font-family:var(--mono)">'+esc(s.replace(/\\/g,""))+'</span>';
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase() }
function aula(t){ const a=TOPICS[t].aula; return {titulo:a[0], itens:a[1], preco:a[2]}; }

function row(f){
  return `<button class="row" data-open="${f.id}"><div><div class="name">${esc(f.nome)}</div><div class="eq">${tex(f.tex)}</div></div><span class="go" aria-hidden="true">›</span></button>`;
}

function renderList(){
  const q = norm(state.q.trim());
  const chips = [...AREAS.map(a=>[a.id,a.nome]),["all","Todas"]]
    .map(([k,n])=>`<button class="chip" id="chip-${k}" data-area="${k}" aria-pressed="${!q && state.area===k}">${n}</button>`).join("");
  let html = `<input class="search" id="busca" type="search" placeholder="Buscar em ${F.length} fórmulas: atrito, Snell, Ohm…" value="${esc(state.q)}" aria-label="Buscar fórmula"><div class="chips">${chips}</div>`;
  let total = 0, body = "";
  for(const a of AREAS){
    if(!q && state.area!=="all" && state.area!==a.id) continue;
    let areaHtml = "", areaCount = 0;
    for(const t of a.assuntos){
      const items = F.filter(f=>f.t===t && (!q || norm(f.nome+" "+TOPICS[t].nome+" "+a.nome).includes(q)));
      if(!items.length) continue;
      areaCount += items.length;
      areaHtml += `<div class="topic"><div class="topic-head"><h3 style="font-size:1.1rem">${TOPICS[t].nome}</h3><span>${items.length}</span></div><div class="list">${items.map(row).join("")}</div></div>`;
    }
    if(!areaCount) continue;
    total += areaCount;
    body += `<div class="area-head"><h2>${a.nome}</h2><span>${a.serie} · ${areaCount} fórmulas</span></div>${areaHtml}`;
  }
  if(q) html += `<p class="count">${total} resultado${total===1?"":"s"} para “${esc(state.q)}”</p>`;
  html += total ? body : `<div class="empty">Nenhuma fórmula com “${esc(state.q)}”. Tente outra palavra.</div>`;
  view.innerHTML = html;
  document.getElementById("busca").addEventListener("input", e=>{ state.q=e.target.value; const pos=e.target.selectionStart; renderList(); const nb=document.getElementById("busca"); nb.focus(); try{nb.setSelectionRange(pos,pos)}catch(_){} });
}

function renderDetail(id){
  const f = F.find(x=>x.id===id), t = TOPICS[f.t], a = areaOf[f.t], au = aula(f.t), fav = favs.includes(id);
  view.innerHTML = `
  <article class="detail">
    <button class="back" data-back>‹ Voltar</button>
    <div class="eyebrow">${a.nome} · ${t.nome}</div>
    <h2>${esc(f.nome)}</h2>
    <div class="board">${tex(f.tex,true)}</div>
    <div class="actions"><button class="fav" id="favbtn" data-fav="${id}" aria-pressed="${fav}">${fav?"★ Nas favoritas":"☆ Favoritar"}</button></div>
    <section class="block"><h3>O que é cada letra</h3>
      <table class="vars"><tbody>${f.vars.map(v=>`<tr><td>${tex(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td></tr>`).join("")}</tbody></table>
    </section>
    <section class="block"><h3>Exemplo resolvido <span class="tag free">Grátis</span></h3>
      <div class="example"><p>${esc(f.ex.enun)}</p><ol class="steps">${f.ex.passos.map(p=>`<li>${esc(p)}</li>`).join("")}</ol><div class="answer">${esc(f.ex.resp)}</div></div>
    </section>
    <section class="block"><h3>Dica do professor</h3><div class="tip">${esc(f.dica)}</div></section>
    <section class="block"><h3>Vídeo <span class="tag free">Grátis</span></h3>
      <a class="video" href="https://www.youtube.com/results?search_query=${encodeURIComponent(f.nome+" física")}" target="_blank" rel="noopener">
        <div class="thumb" aria-hidden="true">▶</div>
        <div><strong>${esc(f.nome)} em poucos minutos</strong><small>Abre no YouTube · no app real, o vídeo do professor</small></div>
      </a>
    </section>
    <section class="block premium">
      <span class="tag" style="background:var(--marker);color:var(--marker-ink)">Aula avançada</span>
      <h3 style="margin-top:8px">${esc(au.titulo)}</h3>
      <ul>${au.itens.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
      <div class="buy"><div class="price">R$ ${au.preco}<small>acesso pela Kiwify</small></div><button class="btn" data-buy="${f.t}">Quero essa aula</button></div>
      <p class="note">No app real, este botão abre o checkout da Kiwify.</p>
    </section>
  </article>`;
  window.scrollTo(0,0);
}

function renderFavs(){
  const items = F.filter(f=>favs.includes(f.id));
  view.innerHTML = `<h2 style="font-size:1.5rem;margin-bottom:12px">Suas favoritas</h2>` +
    (items.length ? `<div class="list">${items.map(row).join("")}</div>`
     : `<div class="empty">Nenhuma favorita ainda. Abra uma fórmula e toque em ☆ Favoritar para ter acesso rápido na hora da prova.</div>`);
}

function renderAulas(){
  let html = `<h2 style="font-size:1.5rem;margin-bottom:4px">Aulas avançadas</h2>
  <p style="color:var(--muted);margin:0 0 4px">Uma aula completa para cada assunto, com o seu professor de física.</p>`;
  for(const a of AREAS){
    html += `<div class="area-head"><h2>${a.nome}</h2><span>${a.serie}</span></div><div class="list" style="gap:12px;margin-top:12px">`;
    for(const t of a.assuntos){ const au=aula(t);
      html += `<div class="course"><span class="eyebrow">${TOPICS[t].nome}</span><h3 style="font-size:1.15rem">${esc(au.titulo)}</h3>
      <ul style="margin:0;padding-left:1.1rem;color:var(--muted)">${au.itens.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
      <div class="buy"><div class="price">R$ ${au.preco}</div><button class="btn" data-buy="${t}">Ver na Kiwify</button></div></div>`;
    }
    html += `</div>`;
  }
  view.innerHTML = html;
}

function render(){
  document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.tab===state.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(state.open) return renderDetail(state.open);
  if(state.tab==="favs") return renderFavs();
  if(state.tab==="aulas") return renderAulas();
  renderList();
}

let tt;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2600); }

document.addEventListener("click", e=>{
  const o=e.target.closest("[data-open]"); if(o){ state.open=o.dataset.open; render(); return; }
  if(e.target.closest("[data-back]")){ state.open=null; render(); return; }
  const ar=e.target.closest("[data-area]"); if(ar){ state.area=ar.dataset.area; state.q=""; render(); return; }
  const nv=e.target.closest("[data-tab]"); if(nv){ state.tab=nv.dataset.tab; state.open=null; render(); window.scrollTo(0,0); return; }
  const fv=e.target.closest("[data-fav]"); if(fv){ const id=fv.dataset.fav; favs = favs.includes(id)?favs.filter(x=>x!==id):[...favs,id]; saveFavs(); render(); toast(favs.includes(id)?"Adicionada às favoritas":"Removida das favoritas"); return; }
  const by=e.target.closest("[data-buy]"); if(by){ toast("Protótipo: aqui abriria o checkout da Kiwify de "+aula(by.dataset.buy).titulo); }
});

render();
</script>

</body>
</html>
